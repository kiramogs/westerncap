    <style>
        /* Perfect and consistent navbar spacing */
        .navbar-nav .nav-item {
            margin-right: 1.8rem !important;
            margin-left: 0 !important;
        }
        
        .navbar-nav .nav-item:last-child {
            margin-right: 0 !important;
        }
        
        /* Adjust spacing for longer text items */
        .navbar-nav .nav-item.dropdown {
            margin-right: 1.5rem !important;
        }
        
        .navbar-nav .nav-item-contact {
            margin-right: 1.8rem !important;
        }
        
        /* Position company dropdown to the left for better visibility */
        .navbar .dropdown-menu {
            left: -20px !important;
            right: auto !important;
            margin-top: 0.5rem !important;
        }
        
        /* Ensure investor relations dropdown stays in default position */
        .navbar .dropdown-investor-relations .dropdown-menu {
            left: 0 !important;
        }
        
        /* Prevent dropdown flickering */
        .navbar .dropdown-menu {
            display: none !important;
        }
        
        .navbar .dropdown-menu.show {
            display: block !important;
        }
    
        /* Nested dropdown positioning (dropend) */
        .navbar .dropend {
            position: relative;
        }
        
        .navbar .dropend > .dropdown-menu {
            left: 100% !important;
            top: 0 !important;
            margin-top: 0 !important;
            margin-left: 0.125rem !important;
        }
        
        /* Arrow indicator for nested dropdowns */
        .navbar .dropend > .dropdown-toggle::after {
            content: "";
            display: inline-block;
            margin-left: 0.255em;
            vertical-align: 0.255em;
            border-top: 0.3em solid transparent;
            border-right: 0;
            border-bottom: 0.3em solid transparent;
            border-left: 0.3em solid;
            transform: rotate(0deg);
        }
        
        /* Ensure Our Products dropdown stays in default position */
        .navbar #navbarDropdownProducts + .dropdown-menu {
            left: 0 !important;
        }
    </style>
</head>
